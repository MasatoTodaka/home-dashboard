services:
  - type: web
    name: home-dashboard
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/index.js
    envVars:
      - key: SWITCHBOT_TOKEN
        sync: false
      - key: SWITCHBOT_SECRET
        sync: false
      - key: ICLOUD_APPLE_ID
        sync: false
      - key: ICLOUD_APP_PASSWORD
        sync: false
      - key: ICLOUD_CALENDAR_NAMES
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      - key: EUFY_EMAIL
        sync: false
      - key: EUFY_PASSWORD
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_SHEET_NAME
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: SYNC_SECRET
        sync: false
